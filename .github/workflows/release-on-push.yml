name: Release On Push

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Prepare release metadata
        id: prepare
        env:
          RELEASE_REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/release/prepare-release.mjs

      - name: Verify release tag is new
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "::error::Tag v${RELEASE_VERSION} already exists. Increment package.json locally before publishing."
            exit 1
          fi

      - name: Package repository
        env:
          RELEASE_ARCHIVE_NAME: ${{ steps.prepare.outputs.archive_name }}
        run: |
          ARCHIVE_PATH="${RUNNER_TEMP}/${RELEASE_ARCHIVE_NAME}"
          zip -r "$ARCHIVE_PATH" . -x ".git/*" ".git"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prepare.outputs.release_title }}
          body: |
            Version: ${{ steps.prepare.outputs.version }}
            Source Commit: ${{ github.sha }}
          files: ${{ env.ARCHIVE_PATH }}
          overwrite_files: true

      - name: Push Teams
        if: always()
        uses: neonidian/teams-notify-build-status@v5
        with:
          webhookUrl: ${{ secrets.Teams }}
          title: Result
          titleBackgroundColor: ${{ job.status }}
          status: ${{ job.status }}
          message: |
            Repository：${{ github.repository }}
            Branch：${{ github.ref_name }}
            tag_name: v${{ steps.prepare.outputs.version }}
            Author：${{ github.actor }}
            👉 [Detail](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
